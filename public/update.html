<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>AniList Tracker — Mise à jour</title>
  <style>
    :root[data-theme="dark"] {
      --bg-primary: #0b1622;
      --bg-secondary: #151f2e;
      --bg-tertiary: #1a2738;
      --border: #1f2d40;
      --text-primary: #e0e6ed;
      --text-secondary: #c5cae9;
      --text-muted: #6b7c93;
      --accent: #3db4f2;
    }

    :root[data-theme="light"] {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e8edf2;
      --border: #d0d9e4;
      --text-primary: #1a2738;
      --text-secondary: #2d3f55;
      --text-muted: #6b7c93;
      --accent: #1a8ac4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-primary);
      color: var(--text-secondary);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      background: var(--bg-tertiary);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      margin-bottom: 24px;
    }

    li {
      font-size: 14px;
      padding: 8px 0 8px 22px;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    li:last-child { border-bottom: none; }

    li::before {
      content: "✦";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    a.btn {
      display: inline-block;
      background: var(--accent);
      color: var(--bg-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .link-btn {
      display: block;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      margin-bottom: 20px;
      text-decoration: underline;
    }

    #history { display: none; margin-bottom: 20px; }

    #history .version-block {
      margin-bottom: 16px;
    }

    #history .version-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    #history ul {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge" id="version-badge"></span>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <ul id="changes"></ul>
    <button id="toggle-history" class="link-btn"></button>
    <div id="history"></div>
    <a class="btn" id="github-link" href="https://github.com/TheNesur/anilist-tracker/releases" target="_blank">Voir sur GitHub</a>
  </div>
  <script src="update.js"></script>
</body>
</html>
