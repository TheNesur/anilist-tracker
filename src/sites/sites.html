<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AniList Tracker</title>
  <style>
    :root[data-theme="dark"] {
      --bg-primary: #0b1622;
      --bg-secondary: #151f2e;
      --bg-tertiary: #1a2738;
      --border: #1f2d40;
      --text-primary: #e0e6ed;
      --text-secondary: #c5cae9;
      --text-muted: #6b7c93;
      --accent: #3db4f2;
    }

    :root[data-theme="light"] {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e8edf2;
      --border: #d0d9e4;
      --text-primary: #1a2738;
      --text-secondary: #2d3f55;
      --text-muted: #6b7c93;
      --accent: #1a8ac4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-primary);
      color: var(--text-secondary);
      font-size: 14px;
      min-height: 100vh;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .filters {
      display: inline-flex;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .filter {
      background: none;
      border: none;
      color: var(--text-muted);
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .filter:hover { color: var(--text-primary); }

    .filter[aria-pressed="true"] {
      background: var(--bg-tertiary);
      color: var(--accent);
      font-weight: 600;
    }

    .search {
      flex: 1;
      min-width: 180px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
    }

    .search:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card-hosts {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-hosts a {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      width: fit-content;
    }

    .card-hosts a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .kinds {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }

    .kind {
      background: var(--bg-tertiary);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 32px 0;
    }

    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 id="page-title"></h1>
    <div class="toolbar">
      <div class="filters" role="group">
        <button type="button" class="filter" data-kind="ALL" aria-pressed="true"></button>
        <button type="button" class="filter" data-kind="MANGA" aria-pressed="false"></button>
        <button type="button" class="filter" data-kind="ANIME" aria-pressed="false"></button>
      </div>
      <input type="search" class="search" id="search" autocomplete="off" />
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint" id="hint"></p>
  </div>
  <script src="sites.ts" type="module"></script>
</body>
</html>
